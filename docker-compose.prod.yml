# Production Docker Compose — Coolify deployment
# Builds backend and frontend from source, connects to external Supabase DB.
#
# Required env vars (set in Coolify):
#   DATABASE_URL    — Supabase connection string
#   JWT_SECRET      — openssl rand -hex 32
#
# Optional:
#   RESEND_API_KEY  — for email verification (without it, codes go to logs)
#   RESEND_FROM_EMAIL — sender email

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONNS=10
      - DATABASE_MIN_CONNS=2
      - MULTICA_DATABASE_STARTUP_TIMEOUT=5m
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
      - DO_NOT_TRACK=true
      - ANALYTICS_DISABLED=true
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-noreply@oduscommerce.com.br}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://task.oduscommerce.com.br}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://task.oduscommerce.com.br}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-wavecommerce.com.br,oduscommerce.com.br}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-wesleymoraesserafim@gmail.com}
    networks:
      - coolify
      - default
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: ${VERSION:-prod}
    expose:
      - "3000"
    depends_on:
      - backend
    environment:
      - REMOTE_API_URL=http://backend:8080
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - coolify
      - default
    restart: unless-stopped

  tools:
    build:
      context: ./services/tools
      dockerfile: Dockerfile
    expose:
      - "8090"
    volumes:
      - tools-data:/data/memory
    environment:
      - ODUS_MEMORY_DIR=/data/memory
      - FIGMA_TOKEN=${FIGMA_TOKEN:-}
    networks:
      - coolify
      - default
    restart: unless-stopped

volumes:
  tools-data:

networks:
  coolify:
    external: true
